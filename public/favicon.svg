<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="70%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Spin Trail Gradients -->
    <linearGradient id="cyanTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="orangeTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ff6600" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <!-- Ball Shading Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fff5e6"/>
      <stop offset="85%" stop-color="#f8a145"/>
      <stop offset="100%" stop-color="#c85a17"/>
    </radialGradient>

    <!-- Paddle Blade Gradient -->
    <linearGradient id="paddleFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b56"/>
      <stop offset="60%" stop-color="#d91438"/>
      <stop offset="100%" stop-color="#8a071f"/>
    </linearGradient>

    <linearGradient id="paddleWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed9b7"/>
      <stop offset="100%" stop-color="#af783e"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Background (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8"/>

  <!-- Magnus Spin Swirl Outer Vortex -->
  <!-- Cyan Topspin Vortex Arc -->
  <path d="M 120 380 C 70 280 90 140 210 90 C 330 40 430 110 440 220" 
        fill="none" stroke="url(#cyanTrail)" stroke-width="18" stroke-linecap="round" filter="url(#glowCyan)"/>

  <!-- Orange Sidespin Arc -->
  <path d="M 390 130 C 445 220 425 355 315 410 C 210 460 115 410 90 310" 
        fill="none" stroke="url(#orangeTrail)" stroke-width="16" stroke-linecap="round" filter="url(#glowOrange)"/>

  <!-- High-Speed Dash Curves -->
  <path d="M 160 120 C 230 75 320 85 375 135" fill="none" stroke="#00f0ff" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round" opacity="0.8"/>
  <path d="M 140 390 C 220 435 320 420 370 370" fill="none" stroke="#ffaa00" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" opacity="0.8"/>

  <!-- Table Tennis Paddle (Striking from lower-left) -->
  <g transform="translate(130, 310) rotate(-35)">
    <!-- Paddle Handle -->
    <rect x="-14" y="80" width="28" height="70" rx="6" fill="url(#paddleWood)" stroke="#523213" stroke-width="3"/>
    <rect x="-6" y="90" width="12" height="50" rx="3" fill="#693d18" opacity="0.6"/>

    <!-- Wood Trim Under Rubber -->
    <ellipse cx="0" cy="0" rx="88" ry="96" fill="url(#paddleWood)"/>

    <!-- Rubber Face -->
    <ellipse cx="0" cy="0" rx="80" ry="88" fill="url(#paddleFace)" stroke="#ff6b81" stroke-width="3"/>

    <!-- Rubber Surface Shine -->
    <path d="M -50 -50 C -20 -75 30 -75 55 -45 C 40 -35 0 -40 -30 -25 Z" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Impact Flare / Flash -->
  <circle cx="270" cy="235" r="26" fill="#ffffff" filter="url(#glowCyan)" opacity="0.9"/>
  <line x1="270" y1="180" x2="270" y2="290" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <line x1="215" y1="235" x2="325" y2="235" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Ping Pong Ball (Celluloid 3-Star with 3D Depth) -->
  <g transform="translate(305, 195)">
    <!-- Soft Glow Drop Shadow -->
    <ellipse cx="6" cy="10" rx="68" ry="68" fill="#ff7700" opacity="0.3" filter="url(#glowOrange)"/>

    <!-- Main Ball Sphere -->
    <circle cx="0" cy="0" r="68" fill="url(#ballGrad)"/>

    <!-- Specular Highlight -->
    <ellipse cx="-24" cy="-24" rx="26" ry="16" transform="rotate(-30, -24, -24)" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="-18" cy="-18" rx="8" ry="5" transform="rotate(-30, -18, -18)" fill="#ffffff" opacity="0.95"/>

    <!-- 3-Star Brand Stamp (★ ★ ★) -->
    <g fill="#9e3c02" opacity="0.85" transform="translate(-10, 16) scale(0.9) rotate(-15)">
      <!-- Star 1 -->
      <polygon points="0,-12 3.5,-3 12,-3 5,2.5 8,11 0,6 -8,11 -5,2.5 -12,-3 -3.5,-3" transform="translate(-24, 0) scale(0.65)"/>
      <!-- Star 2 (Center) -->
      <polygon points="0,-12 3.5,-3 12,-3 5,2.5 8,11 0,6 -8,11 -5,2.5 -12,-3 -3.5,-3" transform="translate(0, -2) scale(0.8)"/>
      <!-- Star 3 -->
      <polygon points="0,-12 3.5,-3 12,-3 5,2.5 8,11 0,6 -8,11 -5,2.5 -12,-3 -3.5,-3" transform="translate(24, 0) scale(0.65)"/>
      <!-- Subtext arc/dots -->
      <circle cx="0" cy="14" r="2.5" fill="#9e3c02"/>
    </g>
  </g>
</svg>
